# Render blueprint: one free web service running the Dockerfile.
# The database lives on Supabase or Neon (free); paste its URL as DATABASE_URL when Render asks.
services:
  - type: web
    name: crunch
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        value: Owner
      - key: AI_PROVIDER
        value: basic
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
